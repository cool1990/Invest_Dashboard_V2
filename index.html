<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>投资看板</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">投资看板</a>
      <nav class="nav" id="nav" aria-label="板块"></nav>
    </div>
  </header>
  <main>
    <div class="page-head">
      <div>
        <h1>投资看板</h1>
        <div class="sub">四板当前环境，以及现在值得盯的变化。点进板块看完整结论。</div>
      </div>
    </div>
    <section class="card env-strip" id="env" aria-label="四板当前环境">
      <div class="env-k">读取中…</div>
    </section>
    <h2 class="layer" id="attn-title">值得关注</h2>
    <p class="layer-sub">每栏最多 5 条，按近 7 天标签变化、极端或告警读数、板块内关注、数据失败或过期来排。没有就写「暂无值得关注」。个股仍在规划中，不列入。</p>
    <div class="attn" id="attn" aria-labelledby="attn-title"></div>
  </main>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/overview.js"></script>
